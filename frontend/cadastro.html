<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta - Swim Finder</title>

    <link
        rel="stylesheet"
        href="/frontend/style.css"
    >

</head>

<body class="tela-autenticacao">

    <main class="auth-container">

        <div class="auth-card auth-card-cadastro">

            <div class="auth-logo">
                🏊
            </div>

            <h1>
                Criar conta
            </h1>

            <p class="auth-subtitulo">
                Crie sua conta no Swim Finder.
            </p>


            <form id="formCadastro">


                <div class="campo-auth">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Como devemos te chamar?"
                        required
                    >

                </div>


                <div class="campo-auth">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>


                <div class="campo-auth">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>


                <div class="campo-auth">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao-auth"
                >
                    Criar minha conta
                </button>

            </form>


            <div class="auth-separador">
                <span>ou</span>
            </div>


            <p class="auth-link">

                Já possui uma conta?

                <a href="/login">
                    Entrar
                </a>

            </p>

        </div>

    </main>


    <script src="/frontend/cadastro.js"></script>

</body>

</html>
