<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Swim Finder</title>

    <link rel="stylesheet" href="/frontend/style.css">

</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">
                🏊
            </div>

            <h1>Swim Finder</h1>

            <p class="login-subtitulo">
                Crie sua conta
            </p>

            <form id="formCadastro">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    required
                >

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    required
                >

                <button type="submit" class="botao-login">
                    Criar conta
                </button>

            </form>

            <p class="criar-conta">
                Já tem uma conta?
                <a href="/login">
                    Entrar
                </a>
            </p>

        </div>

    </main>

    <script src="/frontend/cadastro.js"></script>

</body>

</html>
