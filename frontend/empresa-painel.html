<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel empresarial - Swim Finder</title>

    <link
        rel="stylesheet"
        href="/frontend/style.css"
    >

</head>

<body class="tela-autenticacao">

    <main class="auth-container">

        <div class="auth-card painel-empresa">

            <div class="painel-cabecalho">

                <div class="painel-logo">
                    🏢
                </div>

                <div>
                    <h1 id="nomeEmpresa">
                        Minha empresa
                    </h1>

                    <p>
                        Painel empresarial
                    </p>
                </div>

            </div>


            <div class="status-empresa">
                🟢 Estabelecimento aprovado
            </div>


            <div class="painel-grid">

                <button class="painel-card">

                    <span>✏️</span>

                    <strong>
                        Editar informações
                    </strong>

                    <small>
                        Nome, endereço e descrição
                    </small>

                </button>


                <button class="painel-card">

                    <span>📷</span>

                    <strong>
                        Fotos
                    </strong>

                    <small>
                        Gerencie as fotos do local
                    </small>

                </button>


                <button class="painel-card">

                    <span>🕐</span>

                    <strong>
                        Horários
                    </strong>

                    <small>
                        Altere o funcionamento
                    </small>

                </button>


                <button class="painel-card">

                    <span>💰</span>

                    <strong>
                        Preços
                    </strong>

                    <small>
                        Mensalidade e Day Use
                    </small>

                </button>


                <button class="painel-card">

                    <span>⭐</span>

                    <strong>
                        Avaliações
                    </strong>

                    <small>
                        Veja as avaliações dos usuários
                    </small>

                </button>


                <button
                    class="painel-card"
                    id="botaoSairEmpresa"
                >

                    <span>🚪</span>

                    <strong>
                        Sair
                    </strong>

                    <small>
                        Sair da conta empresarial
                    </small>

                </button>

            </div>

        </div>

    </main>


    <script src="/frontend/empresa-painel.js"></script>

</body>

</html>
