<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Avaliações - Swim Finder</title>

    <link
        rel="stylesheet"
        href="/frontend/style.css"
    >
</head>

<body class="tela-autenticacao">

    <main class="auth-container">

        <div class="auth-card empresa-pagina">

            <h1>⭐ Avaliações</h1>

            <p>
                Veja o que os usuários estão falando sobre sua empresa.
            </p>

            <div
                id="resumoAvaliacoes"
                class="resumo-avaliacoes"
            >
                Carregando avaliações...
            </div>

            <div
                id="listaAvaliacoes"
                class="lista-avaliacoes"
            >
            </div>

            <button
                id="botaoVoltarPainel"
                class="botao-empresa-secundario"
            >
                ← Voltar ao painel
            </button>

        </div>

    </main>

    <script src="/frontend/empresa/empresa-avaliacoes.js"></script>

</body>

</html>
