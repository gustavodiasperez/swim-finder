<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Swim Finder</title>

    <link rel="stylesheet" href="/frontend/style.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">
                🏊
            </div>

            <h1>Swim Finder</h1>

            <p class="login-subtitulo">
                Entre na sua conta
            </p>

            <form id="formLogin">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit" class="botao-login">
                    Entrar
                </button>

            </form>

            <p class="criar-conta">
                Não tem uma conta?
                <a href="/cadastro">
                 Criar conta
                </a>
            </p>

        </div>

    </main>

    <script src="/frontend/login.js"></script>

</body>

</html>
