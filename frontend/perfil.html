<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - Swim Finder</title>

    <link rel="stylesheet" href="/frontend/style.css">

</head>

<body>

    <main class="login-container">

        <div class="foto-perfil-pagina">

            <img
                id="fotoPerfilPagina"
                src=""
                alt="Foto de perfil"
            >

            <span id="avatarPerfilPadrao">
                👤
            </span>

        </div>

            <h1>Meu Perfil</h1>

            <p id="nomePerfil"></p>

            <p id="emailPerfil"></p>

            <p id="favoritosPerfil"></p>

            <p id="avaliacoesPerfil">
                ⭐ Avaliações: 0
            </p>

            <hr>

            <h2>📝 Minhas avaliações</h2>

            <div id="listaMinhasAvaliacoes">
                Carregando avaliações...
            </div>


            <div class="acoes-perfil">

                <button id="voltarApp">
                    🏊 Voltar para o Swim Finder
                </button>

            </div>

        </div>

    </main>


    <script src="/frontend/perfil.js"></script>

</body>

</html>
