<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Swim Finder</title>

    <link
        rel="stylesheet"
        href="/frontend/style.css"
    >

</head>

<body class="tela-autenticacao">

    <main class="auth-container">

        <div class="auth-card escolha-conta-card">

            <div class="auth-logo">
                🏊
            </div>

            <h1>
                Swim Finder
            </h1>

            <p class="auth-subtitulo">
                Como você quer acessar?
            </p>


            <div class="opcoes-conta">

                <button
                    id="botaoUsuario"
                    class="card-tipo-conta"
                >

                    <div class="icone-tipo-conta">
                        👤
                    </div>

                    <div class="texto-tipo-conta">

                        <strong>
                            Sou usuário
                        </strong>

                        <span>
                            Encontre piscinas, favorite locais
                            e faça avaliações.
                        </span>

                    </div>

                    <span class="seta-tipo-conta">
                        ›
                    </span>

                </button>


                <button
                    id="botaoEmpresa"
                    class="card-tipo-conta"
                >

                    <div class="icone-tipo-conta">
                        🏢
                    </div>

                    <div class="texto-tipo-conta">

                        <strong>
                            Sou empresa
                        </strong>

                        <span>
                            Cadastre e gerencie seu
                            estabelecimento no Swim Finder.
                        </span>

                    </div>

                    <span class="seta-tipo-conta">
                        ›
                    </span>

                </button>

            </div>


            <p class="auth-link">

                Já possui uma conta?

                <a href="/login">
                    Entrar
                </a>

            </p>

        </div>

    </main>


    <script src="/frontend/tipo-conta.js"></script>

</body>

</html>
