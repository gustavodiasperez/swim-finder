<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Swim Finder</title>

    <link
        rel="stylesheet"
        href="/frontend/style.css"
    >

</head>

<body class="tela-autenticacao">

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                🏊
            </div>

            <h1>
                Swim Finder
            </h1>

            <p class="auth-subtitulo">
                Entre para encontrar seu próximo treino.
            </p>


            <form id="formLogin">

                <div class="campo-auth">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>


                <div class="campo-auth">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao-auth"
                >
                    Entrar
                </button>

            </form>


            <div class="auth-separador">
                <span>ou</span>
            </div>


            <p class="auth-link">

                Ainda não tem uma conta?

                <a href="/cadastro">
                    Criar conta
                </a>

            </p>

        </div>

    </main>


    <script src="/frontend/usuario/login.js"></script>

</body>

</html>
