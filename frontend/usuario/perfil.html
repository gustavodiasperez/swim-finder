<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Perfil - Swim Finder</title>

    <link
        rel="stylesheet"
        href="/frontend/style.css"
    >

</head>

<body>

    <main class="login-container">

        <div class="login-card perfil-card">


            <!-- FOTO -->

            <div class="foto-perfil-pagina">

                <img
                    id="fotoPerfilPagina"
                    src=""
                    alt="Foto de perfil"
                >

                <span id="avatarPerfilPadrao">
                    👤
                </span>

            </div>


            <!-- NOME -->

            <h1>
                Meu Perfil
            </h1>


            <div class="dados-perfil">

                <p id="nomePerfil"></p>

                <p id="emailPerfil"></p>

                <p id="favoritosPerfil"></p>

                <p id="avaliacoesPerfil">
                    ⭐ Avaliações: 0
                </p>

            </div>


            <hr>


            <!-- AVALIAÇÕES -->

            <h2 class="titulo-avaliacoes">
                📝 Minhas avaliações
            </h2>


            <div id="listaMinhasAvaliacoes">

                Carregando avaliações...

            </div>


            <!-- VOLTAR -->

            <div class="acoes-perfil">

                <button
                    id="voltarApp"
                    class="botao-empresa-secundario"
                >
                    ← Voltar para o Swim Finder
                </button>

            </div>


        </div>

    </main>


    <script src="/frontend/usuario/perfil.js"></script>

</body>

</html>
